env:
  appName: "Chestnut"
  # debug 调试 / test 测试 / release 线上发布
  runMode: "debug"
  timeLocation: "Asia/Shanghai"
  configDirName: ""

filterKeys:
  - "password"

log:
  logDir: ""
  useRotateLog: false
  stdRedirectFileSupport: false
  # 轮转日志保留天数；未设置或设置为 0 时保持默认的 30 天。
  retentionDays: 30

ipWhitelist:
  enabled: false
  allowIPs:
    - "127.0.0.1"
    - "::1"

# 默认关闭。启用后 Chestnut 会注册 /metrics 并采集 Gin HTTP 指标。
prometheus:
  enabled: false
  # 服务名会成为低基数指标标签；启用时必须显式填写非空值。
  serviceName: "Chestnut"
  # 按 Gin FullPath 精确匹配路由模板；支持 /api/*path、/users/:id，不支持 glob 或正则。
  excludedPaths:
    - "/metrics"
    - "/health"
  # 根据请求最终 HTTP 状态排除已完成请求指标。
  excludedStatusCodes:
    - 404

default:
  MySQLSupport: false
  SQLiteSupport: false
  ClickhouseSupport: false
  RedisSupport: false
  MongoDBSupport: false
  LRUCacheSupport: false
  AliyunOSSSupport: false  # 启用后需配置 conf/oss.yaml（参考 contrib/aliyunoss/conf.example/oss.yaml）
  GeeTestSupport: false    # 启用后需配置 conf/geetest.yaml（参考 contrib/geetest/conf.example/geetest.yaml）
  LocalLockPoolSupport: false
  SwaggerSupport: false
  PProfSupport: false
  CronSupport: false
  CronDistributedLockSupport: false
  WebSocketSupport: false
  NATSSupport: false

asyncService:
  Support: false
  QueueSize: 10000
  ConsumerSize: 1000
  TaskMaxRetryCnt: 3
