env:
  appName: "Chestnut"
  # debug 调试 / test 测试 / release 线上发布
  runMode: "debug"
  timeLocation: "Asia/Shanghai"
  configDirName: ""

filterKeys:
  - "password"

log:
  logDir: ""
  useRotateLog: false
  stdRedirectFileSupport: false

default:
  MySQLSupport: false
  SQLiteSupport: false
  ClickhouseSupport: false
  RedisSupport: false
  MongoDBSupport: false
  LRUCacheSupport: false
  AliyunOSSSupport: false
  LocalLockPoolSupport: false
  SwaggerSupport: false
  PProfSupport: false
  CronSupport: false
  CronDistributedLockSupport: false
  WebSocketSupport: false
  NATSSupport: false

asyncService:
  Support: false
  QueueSize: 10000
  ConsumerSize: 1000
  TaskMaxRetryCnt: 3
